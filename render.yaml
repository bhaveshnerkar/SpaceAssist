services:
  - type: web
    name: spaceassist-backend
    runtime: python
    pythonVersion: 3.11
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python download_models.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
